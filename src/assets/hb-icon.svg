<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B3FF"/>
      <stop offset="1" stop-color="#B3E5FF"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD873"/>
      <stop offset="1" stop-color="#FFC94D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 246) rotate(0)">
    <!-- graphite tip -->
    <path d="M -34 168 L 0 240 L 34 168 Z" fill="#5b4636"/>
    <path d="M -14 168 L 0 202 L 14 168 Z" fill="#2b2b2b"/>

    <!-- wood cone -->
    <path d="M -46 128 L 46 128 L 34 168 L -34 168 Z" fill="#F3C583"/>
    <path d="M -46 128 L -34 168 L -20 168 L -34 128 Z" fill="#e0af6c"/>

    <!-- pencil body -->
    <rect x="-46" y="-140" width="92" height="268" rx="18" fill="url(#wood)"/>
    <rect x="-46" y="-140" width="16" height="268" rx="8" fill="#ffffff" opacity="0.25"/>

    <!-- "HB" print band -->
    <rect x="-46" y="-8" width="92" height="34" fill="#7a4a2b" opacity="0.12"/>
    <text x="0" y="16" text-anchor="middle" font-family="'Baloo 2', 'Fredoka', sans-serif" font-weight="700" font-size="26" fill="#7a4a2b">HB</text>

    <!-- ferrule -->
    <rect x="-46" y="-172" width="92" height="34" rx="8" fill="#D9DEE3"/>
    <rect x="-46" y="-172" width="92" height="8" fill="#EDF1F4"/>
    <rect x="-46" y="-150" width="92" height="4" fill="#B9C1C9"/>
    <rect x="-46" y="-140" width="92" height="4" fill="#B9C1C9"/>

    <!-- eraser -->
    <rect x="-46" y="-220" width="92" height="52" rx="20" fill="#FFB3D9"/>
    <rect x="-46" y="-220" width="30" height="52" rx="16" fill="#ffffff" opacity="0.3"/>

    <!-- face -->
    <g>
      <circle cx="-20" cy="-52" r="10" fill="#3a2c22"/>
      <circle cx="20" cy="-52" r="10" fill="#3a2c22"/>
      <circle cx="-23" cy="-56" r="3" fill="#ffffff"/>
      <circle cx="17" cy="-56" r="3" fill="#ffffff"/>
      <circle cx="-32" cy="-28" r="9" fill="#FF9FC8" opacity="0.7"/>
      <circle cx="32" cy="-28" r="9" fill="#FF9FC8" opacity="0.7"/>
      <path d="M -14 -28 Q 0 -14 14 -28" stroke="#3a2c22" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- little arms -->
    <path d="M -46 -20 Q -78 -6 -70 26" stroke="#FFC94D" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 46 -20 Q 78 -6 70 26" stroke="#FFC94D" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="-70" cy="30" r="11" fill="#FFD873"/>
    <circle cx="70" cy="30" r="11" fill="#FFD873"/>
  </g>
</svg>
